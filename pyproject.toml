[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soulvise-plmate"
version = "0.2.0"
description = "Agent 的个性化 Agent：桌面角色、认知、监督、陪看与多 Agent 能力路由"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Soulvise Plmate contributors"}]
dependencies = [
  "PySide6==6.11.1",
  "Pillow==11.3.0",
  "pydantic==2.12.5",
  "psutil==7.2.2",
  "mss==10.2.0",
  "keyring==25.7.0",
  "openai==2.46.0",
  "openai-codex==0.144.4",
  "agent-client-protocol==0.11.0",
]

[project.optional-dependencies]
dev = [
  "Nuitka==4.1.3",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[project.scripts]
soulvise-plmate = "desktop_companion_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/iYwVuthoc/soulvise-plmate"
Repository = "https://github.com/iYwVuthoc/soulvise-plmate"
Issues = "https://github.com/iYwVuthoc/soulvise-plmate/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_companion_agent = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
